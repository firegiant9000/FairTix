fairtix.payment.allow-simulated-outcome=false
stripe.enabled=true
app.cookie.secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://fairtix.netlify.app}
# Don't publish the API surface in production; dev and staging keep Swagger UI and api-docs.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
