spring.application.name=fairtix-test

# PostgreSQL 16 for every Spring context test, through the Testcontainers JDBC URL
# (testcontainers-jdbc, Boot-managed, via testcontainers-postgresql). TC_DAEMON keeps
# one container for the whole JVM; Docker is required. The container suite (*IT,
# profile "it") uses its own @ServiceConnection container instead; see PostgresIT.
spring.datasource.url=jdbc:tc:postgresql:16.10:///fairtix?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Schema comes from Flyway; Hibernate validates it. TestFlywayConfig removes the
# migrations' seed rows after migrating.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Auth
JWT_SECRET=test-secret-key-for-unit-tests-only-not-for-production-use-min-32-chars

# reCAPTCHA (explicitly disabled in tests)
auth.recaptcha.enabled=false
recaptcha.secret=
# Payment Simulation (allow tests to force outcomes)
fairtix.payment.allow-simulated-outcome=true

# Email — no mail host set so NoOpEmailService activates; SmtpEmailService stays disabled
app.mail.from=test@fairtix.com
app.base-url=http://localhost:3000

# Seat Holds
holds.duration-minutes=10
holds.max-duration-minutes=60
holds.cleanup.interval-ms=60000
holds.max-seats-per-hold=10
# Keep limit small so tests don't need to create many seats
holds.max-active-per-holder=2
