# Profile for the PostgreSQL container suite (*IT extending PostgresIT).
# Layers on top of the H2 test application.properties and overrides every H2
# setting. URL, username and password come from @ServiceConnection.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema comes from Flyway only, applied to an empty database; Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
