# Profile for the container suite (*IT extending PostgresIT).
# Layers on top of the test application.properties. URL, username and password
# come from @ServiceConnection; the driver override replaces the Testcontainers
# JDBC driver used by the base properties.
spring.datasource.driver-class-name=org.postgresql.Driver
# Production's Hikari defaults, not the base test file's small shared-database pool.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema comes from Flyway only, applied to an empty database; Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Real Redis 7 container (PostgresIT) instead of the TestRedisConfig mock.
# spring.data.redis.host/port come from PostgresIT's @DynamicPropertySource.
fairtix.test.redis=container

# No @Scheduled jobs (hold expiry, queue admission, ...) committing against the
# shared database mid-test. A test that needs a job calls its method directly.
fairtix.scheduling.enabled=false
