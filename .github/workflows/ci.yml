name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  cookie-auth-guard:
    name: Cookie-auth regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject sessionStorage and Authorization Bearer in frontend src
        run: |
          set -euo pipefail
          matches=$(grep -RInE "sessionStorage|Authorization[^\n]*Bearer\s" frontend/webpages/src || true)
          if [ -n "$matches" ]; then
            echo "::error::Banned auth pattern reintroduced. See docs/adr/0001-cookie-auth.md"
            echo "$matches"
            exit 1
          fi

  notification-gate-guard:
    name: Notification gate regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject EmailService injection outside notifications package
        run: |
          set -euo pipefail
          matches=$(grep -RIln "EmailService" backend/src/main/java \
            | grep -v "/notifications/" || true)
          if [ -n "$matches" ]; then
            echo "::error::EmailService referenced outside com.fairtix.notifications. Inject NotificationGate instead."
            echo "$matches"
            exit 1
          fi

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/webpages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/webpages/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/webpages/coverage/
          if-no-files-found: warn

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "fairtix"
          path: "./backend"
          format: "HTML"

  container-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fairtix ./backend

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fairtix
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
