# Layer 2 of the lab's cost control (docs/infra/teardown-design.md §3). Also layer 1: a
# workflow_dispatch run with force=true destroys without asking teardown.decide.
#
# Skipped until the repository variable LAB_ENABLED is 'true' (FT-7). The scheduled run
# protects nothing until FT-3 builds the AWS side (roles, bootstrap, infra/lab).
name: Lab teardown

on:
  schedule:
    - cron: "17 * * * *" # off the top of the hour, when load (and dropped runs) peak
  workflow_dispatch:
    inputs:
      force:
        description: Destroy without asking teardown.decide (the manual session end)
        type: boolean
        default: false

# Not shared with lab-apply: an apply waiting on approval would hold a shared group for
# up to 30 days. Terraform's S3 lockfile (-lock-timeout) serialises the two instead.
concurrency:
  group: fairtix-lab-teardown
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  issues: write

jobs:

  teardown:
    name: Teardown
    if: vars.LAB_ENABLED == 'true'
    runs-on: ubuntu-latest
    # No required reviewers, no wait timer, main-only branch policy. lab-apply's
    # preflight refuses to create resources if that ever changes.
    environment: lab-teardown
    timeout-minutes: 45

    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/teardown/requirements.lock

      - name: Install pinned dependencies
        working-directory: infra
        run: python -m pip install --require-hashes -r teardown/requirements.lock

      # Trust (FT-3): sub = repo:firegiant9000/FairTix:environment:lab-teardown AND
      # job_workflow_ref = firegiant9000/FairTix/.github/workflows/lab-teardown.yml@refs/heads/main
      - name: Assume the lab-teardown role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.LAB_TEARDOWN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      # teardown.decide always exits 0 and prints exactly "noop" or "destroy"; a census
      # error prints "destroy". Anything else (a crash, odd output) also means destroy.
      - name: Decide
        id: decide
        working-directory: infra
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            decision=destroy
            echo "force=true: destroying without asking teardown.decide"
          else
            decision="$(python -m teardown.decide)" || decision=destroy
          fi
          case "$decision" in
            noop|destroy) ;;
            *) echo "::warning::unexpected decision output; deciding destroy"; decision=destroy ;;
          esac
          echo "decision: $decision"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.decide.outputs.decision == 'destroy'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Terraform destroy
        if: steps.decide.outputs.decision == 'destroy'
        shell: bash
        run: |
          if [ ! -d infra/lab ]; then
            echo "::error::lab stack not present (infra/lab arrives with FT-3); nothing to run destroy against"
            exit 1
          fi
          terraform -chdir=infra/lab init -input=false -lockfile=readonly -no-color
          # The plan stays out of the public log (endpoints, the ALB's /32 ingress); only
          # the summary and errors are printed.
          run_destroy() {
            local status=0
            terraform -chdir=infra/lab destroy -auto-approve -input=false -lock-timeout=15m -no-color > "$RUNNER_TEMP/destroy.log" 2>&1 || status=$?
            grep -E -A4 'Destroy complete|Error:' "$RUNNER_TEMP/destroy.log" || true
            return "$status"
          }
          if run_destroy; then
            exit 0
          fi
          if grep -q DependencyViolation "$RUNNER_TEMP/destroy.log"; then
            echo "DependencyViolation (Fargate ENIs still releasing): waiting 90 s, then retrying once"
            sleep 90
            run_destroy
          else
            exit 1
          fi

      # Doesn't trust Terraform state or tags. Exits 1 on any leftover, 2 on any error.
      - name: teardown.verify
        if: steps.decide.outputs.decision == 'destroy'
        working-directory: infra
        run: python -m teardown.verify

      - name: Reset the expiry
        if: steps.decide.outputs.decision == 'destroy'
        run: aws ssm put-parameter --region us-east-1 --name /fairtix-lab/expires_at --value none --type String --overwrite --output text

      # A timeout cancels the job, so cancelled() is here too.
      - name: Open or update the failure issue
        if: failure() || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="lab teardown failed"
          gh label create lab-teardown --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The lab teardown workflow failed" --force
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label lab-teardown \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label lab-teardown \
              --body "The lab teardown run failed: $RUN_URL. Lab resources may still be billing. Recovery: docs/infra/teardown-design.md §7 and §9."
          fi
