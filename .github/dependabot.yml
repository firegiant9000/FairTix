# Dependabot: one pull request a month covering every ecosystem in this repo.
#
# - All minor and patch updates land together in a single "monthly-dependencies" PR.
# - Major version bumps of libraries are ignored here; take those deliberately
#   in their own branch. GitHub Actions majors are included (they rarely break).
# - Security updates are separate: Dependabot opens those as soon as an
#   advisory affects a dependency, regardless of this schedule.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/configuring-multi-ecosystem-updates
version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend/webpages"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
